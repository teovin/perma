name: Lints

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Flake8
        working-directory: perma_web
        run: |
          uv run --frozen --only-group dev flake8
