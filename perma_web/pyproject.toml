[project]
name = "perma"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    # general
    "celery==5.2.6",
    "Django==4.2.23",
    "django-ratelimit==3.0.1",
    "django-axes==5.27.0",
    "django-waffle==4.1.0",
    "invoke==2.0.0",
    "netaddr==0.8.0",
    "requests==2.32.4",
    "tqdm==4.66.4",
    "Werkzeug==3.0.6",
    "uwsgitop==0.11",

    # databases
    "psycopg2==2.9.9",
    "django-redis==5.2.0",
    "redis==4.5.4",

    # models
    "django-model-utils==4.2.0",
    "django-tree-queries==0.19.0",
    "django-simple-history==3.0.0",
    "django-taggit==5.0.1",
    "django-json-widget==1.1.1",

    # templates
    "django-settings-context-processor==0.2",

    # assets
    "django-webpack-loader==1.8.1",
    "whitenoise==6.0.0",

    # capture related
    "tempdir==0.7.1",
    "ua-parser==0.10.0",
    "warcio==1.7.4",
    "warctools==4.10.0",

    # alternate storages
    "django-storages==1.14.2",
    "boto3==1.35.12",

    # api
    "djangorestframework==3.15.2",
    "django-filter==21.1",

    # link preservation
    "internetarchive==3.0.0",

    # memento support
    "surt==0.3.1",
    "timegate",

    # perma payments
    "PyNaCl==1.5.0",

    # instrumentation
    "sentry-sdk==2.12.0",

    # django-axes requires pkg_resources from setuptools
    "setuptools==80.8.0",
]

[dependency-groups]
dev = [
    "beautifulsoup4==4.12.3",
    "coverage",
    "django-admin-smoke-tests==0.3.0",
    "factory-boy==3.3.0",
    "fakeredis[lua]",
    "flake8==7.0.0",
    "hypothesis==6.98.17",
    "Flake8-pyproject",
    "pytest-cov==4.1.0",
    "pytest-django==4.8.0",
    "pytest-django-ordering==1.2.0",
    "pytest-mock==3.14.0",
    "pytest-xdist==3.5.0",
    "pytest==7.4.4",
    "pyhumps==3.8.0",
    "pytest-playwright==0.4.4",
    "playwright==1.42.0",
    "pytest-django-liveserver-ssl==0.0.2",
    "django-extensions==3.2.3",
    "django-debug-toolbar==4.3.0",
    "watchdog==4.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "perma.settings.deployments.settings_testing"
norecursedirs = ["node_modules"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--browser chromium --screenshot only-on-failure --output failed_test_files"
filterwarnings = ["ignore:Unverified HTTPS request"]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/management/*",
    "*/tests/*",
    "fabfile/*",
    "functional_tests/*",
    "*/settings/*",
]

[tool.flake8]
ignore = ["E126", "E127", "E128", "E2", "W2", "E3", "W3", "E4", "E501", "W504"]
exclude = [".venv", "node_modules", "static", "settings"]

[tool.uv]
package = false

[tool.uv.sources]
timegate = { url = "https://github.com/mementoweb/timegate/archive/6810fbc873b84f6af8e78e89fc8515f21b695cae.zip" }
